
name: Build LimboHardcore

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source ZIP
        run: unzip -q LimboHardcore-Source.zip -d source

      - name: Build plugin
        working-directory: source/LimboHardcore
        run: mvn --batch-mode clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LimboHardcore-JAR
          path: source/LimboHardcore/target/LimboHardcore.jar
          if-no-files-found: error
          retention-days: 14
          
