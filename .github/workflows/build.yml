
name: Build LimboHardcore

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract source ZIP
        run: |
          unzip -o LimboHardcore-Source.zip -d source
          find source -name pom.xml

      - name: Locate Maven project
        id: project
        run: |
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan dalam ZIP."
            exit 1
          fi
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        working-directory: .
        run: mvn -B -f "${{ steps.project.outputs.dir }}/pom.xml" clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LimboHardcore-JAR
          path: ${{ steps.project.outputs.dir }}/target/*.jar
          if-no-files-found: error
          retention-days: 14
          
